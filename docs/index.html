<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Vault</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="app.js" defer></script>
</head>
<body>

  <header>
    <h1><i data-lucide="shield-check"></i> Photo Vault</h1>
    <div class="header-actions">
      <button id="logoutBtn" class="btn-ghost hidden">
        <i data-lucide="log-out"></i> Logout
      </button>
      <button id="settingsBtn" class="btn-ghost hidden">
        <i data-lucide="settings"></i> Settings
      </button>
    </div>
  </header>

  <!-- Auth screen – shown when not logged in -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h2>Sign In</h2>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required autocomplete="username" />
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
        <button type="submit">Login</button>
      </form>
      <p id="authError" class="error-text hidden"></p>
    </div>
  </div>

  <!-- Main app – shown when logged in -->
  <main id="app" class="hidden">

    <!-- Master Key / Settings Overlay Panel -->
    <div id="master-key-panel" class="settings-panel hidden">
      <div class="panel-header">
        <h3><i data-lucide="key-round"></i> Master Key</h3>
        <button id="closeSettings" class="btn-ghost"><i data-lucide="x"></i></button>
      </div>

      <div id="key-status" class="hidden">
        <p class="success-text">
          <i data-lucide="check-circle"></i> Vault decryption ready
        </p>
        <button id="changeKeyBtn" class="btn-ghost">Change Key</button>
      </div>

      <div id="key-input-area">
        <p class="helper-text">
          Enter your master key to decrypt and view photos
        </p>
        <form id="masterKeyForm" class="inline-form">
          <input type="password" id="masterKeyInput" placeholder="Master Encryption Key" required autocomplete="new-password" />
          <button type="submit">Unlock Vault</button>
        </form>
      </div>

      <p id="keyStatusMessage" class="status-message hidden"></p>
    </div>

    <section id="content-area">
      <div id="loading" class="loader-container hidden"></div>
      <ul id="photo-list" class="photo-grid"></ul>
      <div class="footer-actions">
        <button id="loadMore" class="btn-ghost hidden">Load More</button>
      </div>
    </section>
  </main>

  <!-- Photo detail modal -->
  <div id="detail-modal" class="modal-overlay hidden"></div>

</body>
</html>

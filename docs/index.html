<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Smooth PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-screen" class="auth-overlay hidden">
    <div class="auth-card">
      <div class="auth-header">
        <i data-lucide="lock" class="lock-icon"></i>
        <h1>Sign In</h1>
        <p>Access your private library</p>
      </div>
      <div class="auth-form">
        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button id="login-btn" onclick="handleLogin()">Sign In</button>
      </div>
    </div>
  </div>

  <main id="content">
    <div class="search-container">
      <div class="search-input-wrapper">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="photo-search" placeholder="Search photos...">
      </div>
    </div>

    <section class="photos-section">
      <div class="section-header">
        <h2>All Photos</h2>
        <div class="header-actions">
          <button class="text-btn" id="select-mode-btn" onclick="toggleSelectMode()">Select</button>
          <button class="text-btn danger" onclick="handleLogout()">Logout</button>
        </div>
      </div>
      <div class="photo-grid" id="photo-grid"></div>
    </section>
  </main>

  <div id="download-bar" class="action-bar hidden">
    <span id="select-count">0 Selected</span>
    <button class="download-btn" id="dl-btn" onclick="downloadSelected()">
      <i data-lucide="download"></i> Download
    </button>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="app.js"></script>
</body>
</html>
